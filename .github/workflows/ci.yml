name: test

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📶 Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: 📶 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📶 Install
        run: |
          cd packages/parser
          npm i
          cd ../website
          npm i

      - name: 💚 Lint
        run: |
          cd packages/parser
          npm run lint
          cd ../website
          npm run lint

      - name: 🧪 Test
        run: |
          cd packages/parser
          npm test

      - name: 🚧 Build
        run: |
          cd packages/website
          npm run build
