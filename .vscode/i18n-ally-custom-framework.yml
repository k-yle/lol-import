# see https://github.com/antfu/i18n-ally/wiki/Custom-Framework
languageIds:
  - javascript
  - typescript
  - javascriptreact
  - typescriptreact

usageMatchRegex:
  - "[^\\w\\d]t(?:\\.jsx)?\\(['\"`]({key})['\"`]" # matches t("{key}" and t.jsx("{key}"
  - "[^\\w\\d]t(?:\\.jsx)?\\(\\n? +['\"`]({key})['\"`]" # matches t(\n "{key}" and t.jsx(\n "{key}"

refactorTemplates:
  - t("$1")
  - '{t("$1")}'

monopoly: true
